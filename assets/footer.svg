<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Automate everything. Monitor everything. Deploy fearlessly.">
  <defs>
    <linearGradient id="a" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1224" stop-opacity="0"/><stop offset="1" stop-color="#0B1224"/>
    </linearGradient>
  </defs>
  <style>
    .w1 { animation: wave 9s ease-in-out infinite; }
    .w2 { animation: wave 13s ease-in-out infinite reverse; }
    @keyframes wave { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-200px); } }
    .t { font-family: 'JetBrains Mono','Fira Code',Consolas,Menlo,monospace; letter-spacing: 3px; }
    .w { opacity: .35; animation: lit 6s ease-in-out infinite; }
    .w.b { animation-delay: 2s; } .w.c { animation-delay: 4s; }
    @keyframes lit { 0%,100% { opacity: .35; } 15%,35% { opacity: 1; } }
  </style>
  <g fill="none" stroke-width="1.4">
    <path class="w1" stroke="url(#a)" opacity=".55" d="M0 120 C150 90 250 140 400 112 S650 86 800 114 S1050 140 1200 110 S1450 88 1600 116"/>
    <path class="w2" stroke="url(#a)" opacity=".25" d="M-200 128 C-50 108 100 146 250 122 S500 100 650 126 S900 146 1050 120 S1300 104 1500 128"/>
  </g>
  <text class="t" x="600" y="62" text-anchor="middle" font-size="16">
    <tspan class="w" fill="#22D3EE">AUTOMATE EVERYTHING.</tspan>
    <tspan class="w b" fill="#818CF8" dx="14">MONITOR EVERYTHING.</tspan>
    <tspan class="w c" fill="#C084FC" dx="14">DEPLOY FEARLESSLY.</tspan>
  </text>
</svg>
